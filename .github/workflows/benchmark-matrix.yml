name: Native and C toolchain matrix
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-matrix-${{ github.ref }}
  cancel-in-progress: true
env:
  ODIN_VERSION: dev-2026-09
  ODIN_SHA256: 167c3e1d7056419dad2e04bb3bd98715b7ff286d4c125f3c5a5ee337c6254283
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  CODIN_SHA: 5cd28a63023c24079f16e9a51a0140501cebdfa2
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified native compilers and TinyCC
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz" -o "$RUNNER_TEMP/odin.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/odin"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          curl -fL --retry 3 "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/odin" "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y tcc
          mkdir -p build/matrix
          dpkg-query -W tcc > build/matrix/tinycc-package.txt
      - name: Build Borr and pinned Codin
        shell: bash
        run: |
          set -euo pipefail
          make test unit
          git clone https://github.com/Spaceghost/codin.git "$RUNNER_TEMP/codin"
          git -C "$RUNNER_TEMP/codin" checkout --detach "$CODIN_SHA"
          make -C "$RUNNER_TEMP/codin" -j2
      - name: Correctness-gated matrix and offline assembly browser
        run: make matrix MATRIX_ARGS="--codin $RUNNER_TEMP/codin/codin"
      - name: Retain matrix evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: borr-toolchain-matrix-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: build/matrix/
