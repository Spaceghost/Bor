name: Bor language shootout

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ODIN_VERSION: dev-2026-09
  ODIN_SHA256: 167c3e1d7056419dad2e04bb3bd98715b7ff286d4c125f3c5a5ee337c6254283
  CODIN_SHA: 5cd28a63023c24079f16e9a51a0140501cebdfa2
  THOR_SHA: 5e7a2fa67063ca71d7efabb90fbde66a8c91d2fe

jobs:
  shootout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Odin
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" -o "$RUNNER_TEMP/odin.tar.gz"
          echo "${ODIN_SHA256}  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Build Bor and prove both strict C99 backends
        run: make test

      - name: Aggregate completeness scoreboard
        shell: bash
        run: |
          set -u
          printf '%-18s %-8s %-8s %-8s\n' feature native direct mir
          for feature in structs arrays enums slices_strings; do
            native=FAIL; direct=FAIL; mir=FAIL
            if odin check "test/features/$feature" >/tmp/${feature}.native.out 2>/tmp/${feature}.native.err; then native=PASS; fi
            if build/bor emit-c-direct "test/features/$feature" -o "/tmp/${feature}.direct.c" >/tmp/${feature}.direct.out 2>/tmp/${feature}.direct.err; then direct=PASS; fi
            if build/bor emit-c-mir "test/features/$feature" -o "/tmp/${feature}.mir.c" >/tmp/${feature}.mir.out 2>/tmp/${feature}.mir.err; then mir=PASS; fi
            printf '%-18s %-8s %-8s %-8s\n' "$feature" "$native" "$direct" "$mir"
            if test "$direct" = FAIL; then printf '  direct: '; head -n 1 "/tmp/${feature}.direct.err" || true; fi
            if test "$mir" = FAIL; then printf '  mir:    '; head -n 1 "/tmp/${feature}.mir.err" || true; fi
          done

      - name: Prove deterministic C emission
        shell: bash
        run: |
          set -euo pipefail
          for mode in emit-c-direct emit-c-mir; do
            for fixture in melodica linkage control; do
              a="$RUNNER_TEMP/${mode}-${fixture}-a.c"
              b="$RUNNER_TEMP/${mode}-${fixture}-b.c"
              build/bor "$mode" "test/$fixture" -o "$a"
              build/bor "$mode" "test/$fixture" -o "$b"
              cmp "$a" "$b"
            done
          done
          echo 'Bor: deterministic emission proved for both backends and all workloads'

      - name: Prove verified MIR is inspectable and deterministic
        shell: bash
        run: |
          set -euo pipefail
          for fixture in melodica linkage control; do
            a="$RUNNER_TEMP/${fixture}-a.mir"
            b="$RUNNER_TEMP/${fixture}-b.mir"
            build/bor dump-mir "test/$fixture" -o "$a"
            build/bor dump-mir "test/$fixture" -o "$b"
            cmp "$a" "$b"
          done
          echo '=== linkage MIR ==='
          cat "$RUNNER_TEMP/linkage-a.mir"
          echo '=== control MIR ==='
          cat "$RUNNER_TEMP/control-a.mir"
          grep -Eq 'proc #[0-9]+ @internal_c : u32 internal cc=c' "$RUNNER_TEMP/linkage-a.mir" || { echo 'missing internal C-ABI linkage metadata' >&2; exit 1; }
          grep -Eq 'proc #[0-9]+ @public_c : u32 external cc=c' "$RUNNER_TEMP/linkage-a.mir" || { echo 'missing exported C-ABI linkage metadata' >&2; exit 1; }
          grep -Fq ' = xor ' "$RUNNER_TEMP/control-a.mir" || { echo 'missing MIR xor lowering' >&2; exit 1; }
          grep -Eq 'branch %[0-9]+, b[0-9]+, b[0-9]+' "$RUNNER_TEMP/control-a.mir" || { echo 'missing explicit two-successor MIR branch' >&2; exit 1; }
          if grep -Fq 'raw_jump_false ' "$RUNNER_TEMP/control-a.mir"; then
            echo 'bootstrap fallthrough conditional leaked into canonical MIR' >&2
            exit 1
          fi
          grep -Eq 'proc #[0-9]+ @control_mix : u32 external cc=c' "$RUNNER_TEMP/control-a.mir" || { echo 'missing exported control_mix ABI metadata' >&2; exit 1; }
          echo 'Bor: verified MIR dump preserves explicit CFG, linkage, and operator semantics'

      - name: Build Codin oracle
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Spaceghost/codin.git "$RUNNER_TEMP/codin"
          git -C "$RUNNER_TEMP/codin" checkout "$CODIN_SHA"
          make -C "$RUNNER_TEMP/codin" -j2
          "$RUNNER_TEMP/codin/codin" emit-c "$GITHUB_WORKSPACE/test/melodica" -o "$RUNNER_TEMP/codin.c"
          gcc -std=c99 -pedantic-errors -Wall -Wextra -Werror -O3 "$RUNNER_TEMP/codin.c" test/c99/smoke.c -o "$RUNNER_TEMP/codin-smoke"
          "$RUNNER_TEMP/codin-smoke"

      - name: Parse the same fixture with modern Thor
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Spaceghost/Thor.git "$RUNNER_TEMP/thor"
          git -C "$RUNNER_TEMP/thor" checkout "$THOR_SHA"
          make -C "$RUNNER_TEMP/thor" -j2 DEBUG=1
          "$RUNNER_TEMP/thor/thor" test/melodica/main.odin > "$RUNNER_TEMP/thor.ast"
          test -s "$RUNNER_TEMP/thor.ast"

      - name: Informational competitor control workload
        shell: bash
        run: |
          set -u
          if "$RUNNER_TEMP/codin/codin" emit-c "$GITHUB_WORKSPACE/test/control" -o "$RUNNER_TEMP/codin-control.c" \
             && gcc -std=c99 -pedantic-errors -Wall -Wextra -Werror -O3 "$RUNNER_TEMP/codin-control.c" test/c99/control_smoke.c -o "$RUNNER_TEMP/codin-control" \
             && "$RUNNER_TEMP/codin-control"; then
            echo 'Codin control workload: PASS'
          else
            echo 'Codin control workload: FAIL (informational competitor result)'
          fi

          if "$RUNNER_TEMP/thor/thor" test/control/main.odin > "$RUNNER_TEMP/thor-control.ast" \
             && test -s "$RUNNER_TEMP/thor-control.ast"; then
            echo 'Thor control parse: PASS'
          else
            echo 'Thor control parse: FAIL (informational competitor result)'
          fi

      - name: CLI emission latency report
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import statistics
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          root = Path.cwd()
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          tmp = Path(tempfile.mkdtemp(prefix="bor-shootout-"))
          cases = [
              ("bor-direct", [str(root / "build/bor"), "emit-c-direct", str(root / "test/melodica"), "-o", str(tmp / "bor-direct.c")]),
              ("bor-mir", [str(root / "build/bor"), "emit-c-mir", str(root / "test/melodica"), "-o", str(tmp / "bor-mir.c")]),
              ("codin", [str(runner_temp / "codin/codin"), "emit-c", str(root / "test/melodica"), "-o", str(tmp / "codin.c")]),
          ]

          for label, command in cases:
              samples = []
              for _ in range(31):
                  start = time.perf_counter_ns()
                  subprocess.run(command, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  samples.append((time.perf_counter_ns() - start) / 1_000_000)
              samples = samples[1:]
              p50 = statistics.median(samples)
              p95 = sorted(samples)[int(len(samples) * 0.95) - 1]
              print(f"{label:12s} p50={p50:8.3f} ms  p95={p95:8.3f} ms  n={len(samples)}")
          PY

      - name: Shootout report
        shell: bash
        run: |
          set -u
          echo '=== generated C bytes ==='
          wc -c build/direct-melodica.c build/mir-melodica.c build/direct-control.c build/mir-control.c "$RUNNER_TEMP/codin.c"
          if test -f "$RUNNER_TEMP/codin-control.c"; then
            wc -c "$RUNNER_TEMP/codin-control.c"
          fi
          echo '=== verified MIR bytes ==='
          wc -c "$RUNNER_TEMP/melodica-a.mir" "$RUNNER_TEMP/linkage-a.mir" "$RUNNER_TEMP/control-a.mir"
          echo '=== GCC executable sections ==='
          size build/smoke-direct-gcc build/smoke-mir-gcc build/control-direct-gcc build/control-mir-gcc "$RUNNER_TEMP/codin-smoke"
          echo '=== Clang executable sections ==='
          size build/smoke-direct-clang build/smoke-mir-clang build/control-direct-clang build/control-mir-clang
