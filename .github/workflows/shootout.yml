name: Bor language shootout

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ODIN_VERSION: dev-2026-09
  ODIN_SHA256: 167c3e1d7056419dad2e04bb3bd98715b7ff286d4c125f3c5a5ee337c6254283
  CODIN_SHA: 5cd28a63023c24079f16e9a51a0140501cebdfa2
  THOR_SHA: 5e7a2fa67063ca71d7efabb90fbde66a8c91d2fe

jobs:
  shootout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Odin
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" -o "$RUNNER_TEMP/odin.tar.gz"
          echo "${ODIN_SHA256}  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Build Bor and prove both strict C99 backends
        run: make test

      - name: Benchmark Bor runtime lanes and native Odin
        run: make bench

      - name: Build Codin oracle
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Spaceghost/codin.git "$RUNNER_TEMP/codin"
          git -C "$RUNNER_TEMP/codin" checkout "$CODIN_SHA"
          make -C "$RUNNER_TEMP/codin" -j2
          "$RUNNER_TEMP/codin/codin" emit-c "$GITHUB_WORKSPACE/test/melodica" -o "$RUNNER_TEMP/codin.c"
          gcc -std=c99 -pedantic-errors -Wall -Wextra -Werror -O3 "$RUNNER_TEMP/codin.c" test/c99/smoke.c -o "$RUNNER_TEMP/codin-smoke"
          "$RUNNER_TEMP/codin-smoke"
          gcc -std=c99 -pedantic-errors -Wall -Wextra -Werror -O3 "$RUNNER_TEMP/codin.c" test/c99/bench.c -o "$RUNNER_TEMP/codin-bench"
          echo '=== Codin / GCC runtime ==='
          "$RUNNER_TEMP/codin-bench"

      - name: Parse the same fixture with modern Thor
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Spaceghost/Thor.git "$RUNNER_TEMP/thor"
          git -C "$RUNNER_TEMP/thor" checkout "$THOR_SHA"
          make -C "$RUNNER_TEMP/thor" -j2 DEBUG=1
          "$RUNNER_TEMP/thor/thor" test/melodica/main.odin > "$RUNNER_TEMP/thor.ast"
          test -s "$RUNNER_TEMP/thor.ast"

      - name: Measure compiler pipeline throughput
        shell: bash
        run: |
          set -euxo pipefail
          export CODIN_BIN="$RUNNER_TEMP/codin/codin"

          echo '=== 40 complete Odin->C emissions (includes process start, parse, emit, write) ==='
          /usr/bin/time -f 'Bor-direct-40 real=%e user=%U sys=%S rss=%MKB' sh -c '
            i=0; while [ "$i" -lt 40 ]; do
              build/bor emit-c-direct test/melodica -o "$RUNNER_TEMP/timed-direct.c"
              i=$((i+1))
            done'
          /usr/bin/time -f 'Bor-MIR-40 real=%e user=%U sys=%S rss=%MKB' sh -c '
            i=0; while [ "$i" -lt 40 ]; do
              build/bor emit-c-mir test/melodica -o "$RUNNER_TEMP/timed-mir.c"
              i=$((i+1))
            done'
          /usr/bin/time -f 'Codin-40 real=%e user=%U sys=%S rss=%MKB' sh -c '
            i=0; while [ "$i" -lt 40 ]; do
              "$CODIN_BIN" emit-c "$GITHUB_WORKSPACE/test/melodica" -o "$RUNNER_TEMP/timed-codin.c"
              i=$((i+1))
            done'

          echo '=== 25 GCC -O3 translation-only compiles ==='
          /usr/bin/time -f 'GCC-direct-25 real=%e user=%U sys=%S rss=%MKB' sh -c '
            i=0; while [ "$i" -lt 25 ]; do
              gcc -std=c99 -pedantic-errors -O3 -c build/direct-melodica.c -o "$RUNNER_TEMP/direct.o"
              i=$((i+1))
            done'
          /usr/bin/time -f 'GCC-MIR-25 real=%e user=%U sys=%S rss=%MKB' sh -c '
            i=0; while [ "$i" -lt 25 ]; do
              gcc -std=c99 -pedantic-errors -O3 -c build/mir-melodica.c -o "$RUNNER_TEMP/mir.o"
              i=$((i+1))
            done'
          /usr/bin/time -f 'GCC-Codin-25 real=%e user=%U sys=%S rss=%MKB' sh -c '
            i=0; while [ "$i" -lt 25 ]; do
              gcc -std=c99 -pedantic-errors -O3 -c "$RUNNER_TEMP/codin.c" -o "$RUNNER_TEMP/codin.o"
              i=$((i+1))
            done'

      - name: Shootout report
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== generated C bytes ==='
          wc -c build/direct-melodica.c build/mir-melodica.c "$RUNNER_TEMP/codin.c"
          echo '=== GCC executable sections ==='
          size build/smoke-direct-gcc build/smoke-mir-gcc "$RUNNER_TEMP/codin-smoke"
          echo '=== Clang executable sections ==='
          size build/smoke-direct-clang build/smoke-mir-clang
